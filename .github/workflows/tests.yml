name: Tests

# Offline checks of the browser engine and the plain-language layer on every push: no network,
# no browser, no SPHEREx data needed. The headless-Chrome tests (viewer_check, roundtrip, zoomanchor)
# and the pipeline test rounds run on the team's machine (see README "Reproduce").
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node version
        run: node --version
      - name: Plain-language answers (explain.js)
        run: node site/js/tests/explain_test.mjs
      - name: Wavelength-by-wavelength loader (progressive.js, fake session)
        run: node site/js/tests/pg_test.mjs
      - name: Fast-star neighbour check
        run: node site/js/tests/fast_neighbour_test.mjs
      - name: Gaia mirror race (fake network)
        run: node site/js/tests/gaia_race_test.mjs
      - name: WCS against astropy reference values
        run: node site/js/tests/wcs_test.mjs
