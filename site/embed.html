<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazari blink</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="A small SPHEREx blink card from Fazari, made to be embedded in other pages.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%2305070d%22 stroke=%22%237fd4ff%22 stroke-width=%221.6%22/%3E%3Ccircle cx=%2216.5%22 cy=%228%22 r=%222%22 fill=%22%23ffc94d%22/%3E%3C/svg%3E">
<!-- Embeddable mini blink viewer: one card for an <iframe> on other sites (js/embed.js; how to embed: README "Embed").
     Self-contained on purpose: no site stylesheet, no i18n files, no sky map library. -->
<style>
  :root {
    --bg:#0e121b; --fg:#eef1f8; --mut:#a3adc2; --line:rgba(160, 180, 230, .2); --stage:#000;
    --ours:#ffc94d; --ring:#ffb347; --cat:#7fd4ff; --link:#ffc94d;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:var(--bg); color:var(--fg); font:13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100%; }
  a { color:var(--link); }
  :focus-visible { outline:2px solid var(--cat); outline-offset:2px; }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* one card that fills the frame: name, picture (takes the rest), verdict, credit + link, fine print */
  .card { height:100%; display:grid; grid-template-rows:auto minmax(0, 1fr) auto auto auto; gap:6px; padding:8px 9px 7px;
          border:1px solid var(--line); }
  .hd { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .hd h1 { margin:0; font-size:1.08em; font-weight:700; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .hd .kind { flex:none; font-size:.8em; color:var(--mut); white-space:nowrap; }
  .hd .kind::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:var(--k, var(--cat)); vertical-align:1px; }

  .stage { position:relative; min-height:0; overflow:hidden; background:var(--stage); border-radius:8px; }
  .pic { position:absolute; left:0; top:0; transform-origin:0 0; }
  .pic > img, .pic > svg, .pic > canvas { position:absolute; left:0; top:0; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
  .pic > img { visibility:hidden; }
  .pic > img.on { visibility:visible; }
  .pic > svg { overflow:visible; pointer-events:none; }
  .pic > canvas { image-rendering:auto; }
  .tag { position:absolute; left:6px; top:6px; display:flex; align-items:baseline; gap:6px; max-width:calc(100% - 12px);
         background:rgba(5, 7, 13, .78); border-left:4px solid var(--v, #4a5368); border-radius:5px; padding:2px 7px 2px 6px;
         font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
  .tag small { font-weight:500; color:var(--mut); font-size:.85em; }
  .hud { position:absolute; left:6px; bottom:6px; display:flex; align-items:center; gap:6px; font-size:.8em; color:#dfe5f2;
         background:rgba(5, 7, 13, .72); border-radius:5px; padding:2px 7px 2px 3px; pointer-events:none; }
  .hud svg { display:block; }
  .hud .bar { display:inline-block; height:3px; background:#dfe5f2; border-radius:2px; }
  .ctl { position:absolute; right:6px; bottom:6px; display:flex; align-items:center; gap:4px; }
  .dots { display:flex; gap:2px; background:rgba(5, 7, 13, .72); border-radius:999px; padding:0 3px; }
  .dot { width:20px; height:24px; padding:0; border:0; background:none; display:grid; place-items:center; }
  .dot::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--v); opacity:.45; box-shadow:0 0 0 1.5px rgba(0, 0, 0, .6); }
  .dot[aria-current="true"]::before { opacity:1; box-shadow:0 0 0 2px #fff; }
  .pp { width:30px; height:30px; padding:0; border:1px solid rgba(255, 255, 255, .28); border-radius:50%; background:rgba(5, 7, 13, .8);
        display:grid; place-items:center; }
  .pp svg { width:14px; height:14px; }
  .msg { position:absolute; inset:0; display:grid; place-items:center; padding:14px; text-align:center; color:var(--mut); }

  .vd { margin:0; font-size:.98em; line-height:1.32; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; }
  .vd b { font-weight:700; color:var(--ours); }
  .vd .wait { color:var(--mut); }
  .ft { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
  .brand { display:inline-flex; align-items:center; gap:5px; font-weight:700; letter-spacing:.01em; white-space:nowrap; min-width:0; }
  .brand svg { flex:none; }
  .open { flex:none; font-weight:650; text-decoration:none; white-space:nowrap; border:1px solid rgba(255, 201, 77, .45); border-radius:999px; padding:3px 10px; }
  .open:hover { background:rgba(255, 201, 77, .1); }
  .fine { margin:0; font-size:.78em; color:var(--mut); line-height:1.3; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; }
  .fine abbr { text-decoration:underline dotted; text-underline-offset:2px; cursor:help; }

  /* a free point: where it is on the SPHEREx all-sky map, and how to measure it */
  .sky { position:absolute; inset:0; display:grid; place-items:center; }
  .sky .map { position:relative; width:100%; aspect-ratio:2 / 1; max-height:100%; }
  .sky .map img { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  .sky .map svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .pos { position:absolute; left:6px; top:6px; right:6px; display:flex; flex-wrap:wrap; gap:2px 8px; pointer-events:none; }
  .pos span { background:rgba(5, 7, 13, .78); border-radius:5px; padding:2px 7px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .go { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); white-space:nowrap; font-weight:650; color:#1a1300; background:var(--ours);
        border:0; border-radius:999px; padding:5px 13px; }
  .go:disabled { opacity:.6; cursor:default; }
  .prog { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255, 255, 255, .08); }
  .prog i { display:block; height:100%; width:0; background:var(--cat); transition:width .3s; }

  @media (min-width:440px) and (min-height:380px) { body { font-size:14px; } .card { padding:10px 12px 9px; gap:8px; } .pp { width:34px; height:34px; } }
  @media (max-width:330px) { body { font-size:12px; } .hd .kind { display:none; } .open { padding:2px 8px; } }
  @media (max-height:250px) { .hd { display:none; } .card { grid-template-rows:minmax(0, 1fr) auto auto auto; } }
  @media (prefers-reduced-motion: reduce) { .prog i { transition:none; } }
</style>
</head>
<body>
<main class="card" id="card" aria-labelledby="name">
  <header class="hd"><h1 id="name">Fazari</h1><span class="kind" id="kind" hidden></span></header>
  <div class="stage" id="stage" role="group" aria-roledescription="blink" aria-label="SPHEREx images">
    <div class="msg" id="msg">Loading…</div>
  </div>
  <p class="vd" id="vd" aria-live="polite"></p>
  <div class="ft">
    <span class="brand"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#05070d" stroke="#7fd4ff" stroke-width="1.6"/><circle cx="16.5" cy="8" r="2" fill="#ffc94d"/></svg>Fazari · SPHEREx</span>
    <a class="open" id="open" href="./" target="_blank" rel="noopener">Open in Fazari ↗</a>
  </div>
  <p class="fine" id="fine">NASA SPHEREx (IRSA)</p>
</main>
<script type="module" src="js/embed.js"></script>
</body>
</html>
