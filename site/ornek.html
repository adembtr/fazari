<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazari Blink Preview</title>
<style>
  :root { --bg:#0b0d12; --fg:#e8eaf0; --mut:#9aa3b2; --acc:#ffb347; --card:#151925; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 14px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; background:var(--card);
              padding:10px 12px; border-radius:8px; margin-bottom:10px; }
  label { color: var(--mut); font-size: .9rem; }
  select, button { font: inherit; background:#222838; color:var(--fg); border:1px solid #333b50;
                   border-radius:6px; padding:4px 10px; }
  button { cursor:pointer; min-width: 70px; }
  .stage { position:relative; width:100%; aspect-ratio:720/770; background:#000; border-radius:6px; overflow:hidden; }
  .zoom { position:absolute; inset:0; transition: transform .25s ease; }
  .stage img { position:absolute; inset:0; width:100%; height:100%; image-rendering: pixelated; }
  .stage svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .info { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin:8px 0 14px; }
  .date { font-size:1.15rem; color:var(--acc); font-variant-numeric: tabular-nums; }
  .card { background:var(--card); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .card h2 { font-size: 1rem; margin: 0 0 6px; }
  table { border-collapse: collapse; width:100%; font-size:.9rem; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #262c3c; }
  .diff img { width:100%; image-rendering: pixelated; border-radius:6px; }
  small { color: var(--mut); }
  .targets { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .targets button.on { border-color: var(--acc); color: var(--acc); }
  .targets button:disabled { opacity:.45; cursor:default; }
  .status { padding:8px 10px; border-radius:6px; margin:0 0 8px; border-left:4px solid var(--acc); background:#1d2232; }
  .status.not_detected { border-left-color:#e05d5d; }
  .status.partial, .status.detected_one_season { border-left-color:#e0b85d; }
  .status.detected { border-left-color:#5dbb7a; }
  td.det { color:#8fe0a5; font-weight:600; }
  td.num { font-variant-numeric: tabular-nums; }
  details summary { cursor:pointer; color:var(--mut); margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">SPHEREx blink</h1>
  <p class="sub" id="subtitle">Loading meta.json ...</p>
  <div class="targets" id="targets"></div>
  <p class="sub"><a href="sky.html" style="color:var(--acc)">Any coordinate (beta): blink any point of the sky in your browser &rarr;</a></p>

  <div class="controls">
    <label>Wavelength <select id="wl"></select></label>
    <button id="play">Pause</button>
    <label>Frame time <input id="speed" type="range" min="150" max="2000" step="50" value="800"></label>
    <span id="speedv" class="sub" style="margin:0">800 ms</span>
    <label>Zoom <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option></select></label>
    <label><input id="mark" type="checkbox" checked> <span id="marklabel">Gaia</span> marker</label>
  </div>

  <div class="stage" id="stage">
    <div class="zoom" id="zoomer">
      <img id="frame" alt="SPHEREx frame">
      <svg id="ov" viewBox="0 0 720 770"></svg>
    </div>
  </div>
  <div class="info">
    <span class="date" id="date"></span>
    <span id="detail" class="sub" style="margin:0"></span>
  </div>

  <div class="card">
    <h2 id="mtitle">Measured motion</h2>
    <div id="measure"></div>
  </div>
  <div class="card diff">
    <h2>Difference (last minus first season)</h2>
    <img id="diff" alt="difference image">
    <small>Red = later, blue = earlier. Stars that do not move cancel out.</small>
  </div>
  <p><small id="src"></small></p>
</main>
<script>
const BASE = new URLSearchParams(location.search).get("data") || "data/barnard/";
let meta, bin, idx = 0, timer = null, playing = true;
const $ = id => document.getElementById(id);

// Target buttons: the five challenge targets; a target is enabled once its products exist.
const TARGETS = [["barnard", "Barnard's Star"], ["eps_indi_b", "Epsilon Indi B"],
                 ["wise0855", "WISE 0855-0714"], ["rw_aur", "RW Aurigae"], ["r_dra", "R Draconis"]];
TARGETS.forEach(([id, name]) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.disabled = true;
  if (BASE.replace(/^\.?\//, "") === `data/${id}/`) b.classList.add("on");
  b.onclick = () => { location.search = "?data=data/" + id + "/"; };
  $("targets").appendChild(b);
  fetch(`data/${id}/meta.json`, { method: "HEAD" })
    .then(r => { if (r.ok) b.disabled = false; else { b.textContent = name + " (soon)"; b.title = "Coming soon"; } })
    .catch(() => { b.textContent = name + " (soon)"; b.title = "Coming soon"; });
});

function show() {
  const f = bin.frames[idx];
  $("frame").src = BASE + f.file;
  $("date").textContent = f.epoch + "  (" + f.date + ")";
  $("detail").textContent = `${f.detectors.join("+")} · ${f.wavelength_um.toFixed(2)} µm · ${f.n_images} images stacked`;
  drawMarker(f.epoch);
}
// where the catalogue puts the target in each season: meta.markers (always present in new
// products), else the measured positions (older products)
function markerXY(epoch) {
  const mk = (meta.markers || []).find(q => q.epoch === epoch);
  if (mk) return mk.png_xy;
  const p = ((meta.measured || {}).positions || []).find(q => q.epoch === epoch);
  return p ? p.png_xy_gaia : null;
}
function allMarkers() {
  if (meta.markers && meta.markers.length) return meta.markers.map(m => m.png_xy);
  return ((meta.measured || {}).positions || []).map(p => p.png_xy_gaia);
}
const fx = (v, d = 2) => (v == null || !isFinite(v)) ? "–" : (+v).toFixed(d);
function pngSize() { return (meta.grid && meta.grid.png_px) || [720, 720]; }
function applyZoom() {
  // zoom around the target (mean predicted position over the seasons); the label strip on
  // top of each PNG is cut off when zoomed, the date is shown below the image instead
  const [W, H] = pngSize();
  const z = +$("zoom").value;
  const ps = allMarkers();
  let cx = W / 2, cy = (H + ((meta.grid && meta.grid.label_strip_px) || 0)) / 2;
  if (ps.length) {
    cx = ps.reduce((a, p) => a + p[0], 0) / ps.length;
    cy = ps.reduce((a, p) => a + p[1], 0) / ps.length;
  }
  $("zoomer").style.transformOrigin = `${(100 * cx / W).toFixed(2)}% ${(100 * cy / H).toFixed(2)}%`;
  $("zoomer").style.transform = `scale(${z})`;
}
function drawMarker(epoch) {
  const ov = $("ov");
  const [W, H] = pngSize();
  ov.setAttribute("viewBox", `0 0 ${W} ${H}`);
  ov.innerHTML = "";
  if (!$("mark").checked) return;
  const xy = markerXY(epoch);
  if (!xy) return;
  const [x, y] = xy;
  const sw = 3 / +$("zoom").value;
  // ring = where Gaia says the star is at this season; small cross = its exact centre
  ov.innerHTML = `<circle cx="${x}" cy="${y}" r="34" fill="none" stroke="#ffb347" stroke-width="${sw}"/>` +
    `<path d="M${x-6} ${y}H${x+6}M${x} ${y-6}V${y+6}" stroke="#ffb347" stroke-width="${sw}"/>`;
}
function tick() { idx = (idx + 1) % bin.frames.length; show(); }
function restart() {
  clearInterval(timer);
  if (playing) timer = setInterval(tick, +$("speed").value);
}
function selectBin(i) {
  bin = meta.wavelength_bins[i]; idx = 0;
  $("diff").src = BASE + bin.diff;
  show(); restart();
}
fetch(BASE + "meta.json").then(r => r.json()).then(m => {
  meta = m;
  const [W, H] = pngSize();
  $("stage").style.aspectRatio = `${W} / ${H}`;
  applyZoom();
  $("title").textContent = m.target + " — SPHEREx blink";
  $("subtitle").textContent = `Centre RA ${m.ra.toFixed(4)}°, Dec ${m.dec.toFixed(4)}° (epoch ${m.epoch_center}). ` +
    `Background stars stay still; the target moves.`;
  m.wavelength_bins.forEach((b, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = b.wavelength_um.toFixed(1) + " µm (" + b.frames.length + " seasons)";
    $("wl").appendChild(o);
  });
  const ms = m.measured || {};
  const ref = (m.gaia && m.gaia.label) || "Gaia DR3";
  $("marklabel").textContent = ref.split(" (")[0];
  let html = "";
  if (ms.message) html += `<p class="status ${ms.status || ""}">${ms.message}</p>`;
  if (ms.shift_arcsec != null) {
    html += `<p>${ms.from_epoch} → ${ms.to_epoch}: moved <b>${fx(ms.shift_arcsec)}"</b>` +
      (ms.shift_err_arcsec ? ` ± ${fx(ms.shift_err_arcsec)}"` : "") + ` toward PA ${fx(ms.pa_deg, 0)}°. ` +
      `${ref} predicts <b>${fx(ms.gaia_predicted_arcsec)}"</b> toward PA ${fx(ms.gaia_pa_deg, 0)}°.` +
      (ms.same_orientation === false ? ` <small>(seasons seen with the telescope turned 180°)</small>` : "") + `</p>`;
  }
  if (ms.fit) {
    html += `<p><small>Proper motion from ${ms.fit.n_used} images: ${fx(ms.fit.pmra_mas_yr, 0)} ± ${fx(ms.fit.pmra_err_mas_yr, 0)}, ` +
      `${fx(ms.fit.pmdec_mas_yr, 0)} ± ${fx(ms.fit.pmdec_err_mas_yr, 0)} mas/yr (${ref}: ${fx(ms.fit.gaia_pmra_mas_yr, 0)}, ${fx(ms.fit.gaia_pmdec_mas_yr, 0)}).</small></p>`;
  }
  const rows = (ms.positions || []).map(p =>
    `<tr><td>${p.epoch}</td><td>${p.date}</td><td>${p.n_images}</td>` +
    `<td class="num">${fx(p.minus_gaia_east_arcsec)}", ${fx(p.minus_gaia_north_arcsec)}"</td>` +
    `<td class="num">${fx(p.err_east_arcsec)}", ${fx(p.err_north_arcsec)}"</td></tr>`).join("");
  if (rows) html += `<table><tr><th>Season</th><th>Mean date</th><th>Images</th><th>Measured − ${ref.split(" (")[0]} (E, N)</th><th>± (E, N)</th></tr>${rows}</table>`;
  const fc = ms.field_calibration;
  if (fc && fc.applied && fc.n_exposures_calibrated > 0)
    html += `<small>Positions are tied to Gaia DR3 with the field stars of the same images ` +
      `(${fc.n_exposures_calibrated} exposures calibrated).</small> `;
  else if (fc && fc.applied)
    html += `<small>Field-star calibration not applied: too few Gaia stars at these wavelengths; positions use the SPHEREx WCS.</small> `;
  if (rows && ms.positions.some(p => p.bias_corrected) && ms.same_orientation === true)
    html += `<small>Positions corrected for a small detector-fixed centroid bias (fitted per detector); ` +
    `the main result above uses two seasons seen in the same orientation, where that bias cancels.</small>`;
  // detection check: S/N at the predicted position per wavelength bin and season
  const det = ms.detection;
  if (det && det.bins && det.bins.length) {
    const eps = m.epochs;
    const bl = [...new Set(det.bins.map(c => c.wavelength_um))];
    let t = `<tr><th>Bin</th>${eps.map(e => `<th>${e}</th>`).join("")}</tr>`;
    bl.forEach(b => {
      t += `<tr><td>${b.toFixed(1)} µm (${det.bins.find(c => c.wavelength_um === b).detector})</td>` + eps.map(e => {
        const c = det.bins.find(q => q.wavelength_um === b && q.epoch === e);
        if (!c) return "<td>–</td>";
        const v = c.saturated_frac > 0.5 ? "sat." : fx(c.snr, 1);
        return `<td class="num ${c.detected ? "det" : ""}">${v} <small>(${c.n})</small></td>`;
      }).join("") + "</tr>";
    });
    html += `<details${ms.status === "detected" ? "" : " open"}><summary>Detection check: S/N at the predicted position ` +
      `(single-season stacks, ≥${det.threshold_snr}σ in green; number of images in brackets)</summary><table>${t}</table>` +
      (det.blend_note ? `<small>${det.blend_note}</small>` : "") +
      ((det.blend_check || []).length ? `<small>Nearest catalogue source to the predicted position: ` +
        det.blend_check.map(b => `${b.epoch} ${fx(b.nearest_arcsec, 1)}"`).join(", ") + ` (fitted together with the target).</small>` : "") +
      `</details>`;
  }
  // relative photometry (brightness targets)
  const ph = ms.photometry;
  if (ph) {
    $("mtitle").textContent = "Brightness change (relative photometry)";
    const eps = m.epochs;
    let t = `<tr><th>Bin</th>${eps.map(e => `<th>${e}</th>`).join("")}<th>Note</th></tr>`;
    ph.bins.forEach(b => {
      t += `<tr><td>${b.wavelength_um.toFixed(1)} µm</td>` + eps.map(e => {
        const s = (b.seasons || []).find(q => q.epoch === e);
        if (!s) return "<td>–</td>";
        return s.ratio_err ? `<td class="num">${fx(s.ratio_to_first)} ± ${fx(s.ratio_err)}</td>` : `<td class="num">1 (ref.)</td>`;
      }).join("") + `<td><small>${(b.flags || []).join("; ") || (b.method === "psf" ? "PSF flux" : "")}` +
      (b.n_comparison ? ` · ${b.n_comparison} comparison stars` : "") + `</small></td></tr>`;
    });
    html += `<p>Target flux relative to comparison stars in the same images, as a ratio to the first season ` +
      `(1.20 = 20 % brighter).</p><table>${t}</table><p><small>${ph.method} ${(ph.caveats || []).join(" ")}</small></p>`;
  }
  if (ms.finding) html += `<p><small><b>Finding:</b> ${ms.finding}</small></p>`;
  if (ms.note) html += `<p><small>${ms.note}</small></p>`;
  $("measure").innerHTML = html;
  $("src").textContent = "Data: " + m.data_source + ". Generated " + m.generated + ".";
  // start on a wavelength where the target is detected (e.g. 4.6 um for WISE 0855)
  const db = ((ms.detection || {}).detected_bins_um || []);
  let start = 0;
  if (db.length && ms.status !== "detected") {
    const k = m.wavelength_bins.findIndex(b => b.wavelength_um === db[db.length - 1]);
    if (k >= 0) start = k;
  }
  $("wl").value = start;
  selectBin(start);
}).catch(e => { $("subtitle").textContent = "Could not load " + BASE + "meta.json (" + e + "). Serve this folder with: python -m http.server"; });

$("wl").onchange = e => selectBin(+e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; restart(); };
$("speed").oninput = e => { $("speedv").textContent = e.target.value + " ms"; restart(); };
$("mark").onchange = () => show();
$("zoom").onchange = () => { applyZoom(); show(); };
</script>
</body>
</html>
